[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragapp"
version = "0.1.0"
description = "Local, production-grade Retrieval-Augmented Generation (RAG) over PDF documents, powered by Ollama."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "ollama>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "streamlit>=1.45,<2",
    "rapidocr>=3.0",            # OCR for scanned pages / table images (ONNX, CPU)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "ragapp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
